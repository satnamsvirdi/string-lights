name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        node: [22, 24]
        include:
          - node: 22
            react: 18.3.1
          - node: 24
            react: 19.3.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Verify React 18 compatibility
        if: matrix.node == 22
        run: npm install --no-save --package-lock=false react@18.3.1 react-dom@18.3.1
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check
      - name: Verify minimum supported package runtime
        run: npm exec --yes --package=node@18.20.8 -- node .recovery/package-consumer/runtime-smoke.mjs
      - run: git diff --exit-code -- registry
      - run: npm audit --omit=dev --audit-level=moderate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: traces-node-${{ matrix.node }}
          path: test-results
          retention-days: 7
